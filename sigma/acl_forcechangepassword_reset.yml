title: Delegated Password Reset - Suspicious ForceChangePassword Abuse
id: f6c8ab37-5a9c-4d2e-8b34-misconfig00001
status: experimental

description: |
  Detects an account password reset (event 4724) performed by one account
  against another — the observable result of ForceChangePassword abuse. A
  helpdesk/low-privilege user resetting the password of a service or privileged
  account (rather than an ordinary user) is a privilege-escalation indicator.

  4724 fires when one principal resets ANOTHER principal's password (distinct
  from 4723, self-service change). It is common — helpdesk staff reset user
  passwords routinely — so the signal is the actor/target PAIRING, not the
  event alone. This rule flags resets targeting service/privileged accounts;
  tune the target list and any legitimate reset operators to your environment.

references:
- https://attack.mitre.org/techniques/T1098/
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4724

author: Waleed
date: 2026-09-23
tags:
- attack.persistence
- attack.privilege_escalation
- attack.t1098
logsource:
  product: windows
  service: security

detection:
  selection:
    EventID: 4724
  target_sensitive:
    # Password resets targeting service/privileged accounts are the anomaly.
    # Expand this to your naming conventions (svc-*, adm-*, admin accounts).
    TargetUserName|startswith:
    - 'svc-'
    - 'adm'
    TargetUserName|contains:
    - 'admin'
  condition: selection and target_sensitive
falsepositives:
- Legitimate administration of service accounts by authorized operators — baseline and allow-list the accounts/operators that legitimately do this.
- Scheduled service-account password rotation tooling.
level: medium

# Validation: jsmith (Helpdesk, unprivileged) reset svc-report via delegated
# ForceChangePassword -> 4724 with Account_Name=jsmith, Target_User_Name=svc-report.
# Convert: sigma convert -t splunk -p splunk_windows sigma/acl_forcechangepassword_reset.yml
# NOTE generated SPL has no index= -- add index=wineventlog by hand.
#
# Stronger (environment-specific) variant: rather than matching target NAME
# patterns, correlate 4724 against a lookup of privileged/service accounts and
# a lookup of authorized reset operators, alerting when actor is not authorized
# OR target is privileged. That correlation belongs in SPL, not a static rule.
