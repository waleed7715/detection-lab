title: Delegated Password Reset - Suspicious ForceChangePassword Abuse
id: 7e5f18c6-f694-4581-ae48-6d4ae8f6dc17
status: test

description: |
  Detects an account password reset (event 4724) performed by one account
  against another — the observable result of ForceChangePassword abuse. A
  helpdesk/low-privilege user resetting the password of a service or privileged
  account (rather than an ordinary user) is a privilege-escalation indicator.

  4724 fires when one principal resets ANOTHER principal's password (distinct
  from 4723, self-service change). It is common — helpdesk staff reset user
  passwords routinely — so the signal is the actor/target PAIRING, not the
  event alone. This rule flags resets whose TARGET name matches service/admin
  patterns.

  SCOPE / LIMITATION: this is a NAME-PATTERN heuristic. It only catches targets
  whose names signal privilege (svc-*, adm*, *admin*), and will miss privileged
  accounts named normally or false-positive on benign accounts that happen to
  match. It validates in this lab because accounts are named by convention. A
  production rule should correlate 4724 against a LOOKUP of actual
  privileged/service accounts (and of authorized reset operators), not names.

  COVERAGE: catches SUCCESSFUL resets only. A reset DENIED by AdminSDHolder
  (e.g. against a Domain Admin) generates NO 4724 — per Microsoft, no Failure
  event is produced on Access Denied — so blocked attempts are invisible to
  this rule. See README.

references:
- https://attack.mitre.org/techniques/T1098/
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4724

author: Waleed
date: 2026-09-23
tags:
- attack.persistence
- attack.privilege_escalation
- attack.t1098
logsource:
  product: windows
  service: security

detection:
  selection:
    EventID: 4724
  target_sensitive:
    Target_Account_Name:
    - 'svc-*'
    - 'adm*'
    - '*admin*'
  condition: selection and target_sensitive

falsepositives:
- Legitimate administration of service accounts by authorized operators — baseline and allow-list the accounts/operators that legitimately do this.
- Scheduled service-account password rotation tooling.
- Benign accounts whose names coincidentally match the patterns (a cost of the name-based heuristic; the lookup-based variant avoids this).
level: medium

# Validated: jsmith (Helpdesk, unprivileged) reset svc-report via delegated
# ForceChangePassword -> 4724 with Subject_Account_Name=jsmith,
# Target_Account_Name=svc-report. Working SPL:
#
#   source="WinEventLog:Security" EventCode=4724
#   (Target_Account_Name="svc-*" OR Target_Account_Name="adm*" OR Target_Account_Name="*admin*")
#
# NOTE: Splunk field is Target_Account_Name (not TargetUserName / Target_User_Name).
# Generated SPL has no index= -- add index=wineventlog by hand.
#
# Stronger variant: correlate 4724 against a lookup of privileged/service
# accounts AND authorized reset operators; alert when actor is unauthorized OR
# target is privileged. That correlation belongs in SPL, not a static rule.
