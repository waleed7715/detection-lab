title: Domain Account and Group Discovery via Built-in Utilities
id: 8f3c1e7a-2b94-4d61-9a05-7c3e1f6b0d42
status: experimental
description: |
  Detects domain reconnaissance using built-in Windows utilities. An unprivileged
  domain user can enumerate all accounts, group membership, and domain controllers
  because Authenticated Users holds read access across most of the directory by
  default. The domain controller does not record this activity: net.exe queries
  over SAMR rather than LDAP, so no 4662 is generated regardless of audit
  configuration. Endpoint process telemetry is the only reliable source.
references:
  - https://attack.mitre.org/techniques/T1087/002/
  - https://attack.mitre.org/techniques/T1069/002/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/network-access-restrict-clients-allowed-to-make-remote-sam-calls
author: Waleed Hussain
date: 2026/09/18
tags:
  - attack.discovery
  - attack.t1087.002
  - attack.t1069.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_net:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
    CommandLine|contains: ' /domain'
    CommandLine|contains:
      - 'user'
      - 'group'
      - 'localgroup'
  selection_nltest:
    Image|endswith: '\nltest.exe'
    CommandLine|contains:
      - '/dclist'
      - '/domain_trusts'
      - '/all_trusts'
  # net.exe re-executes itself as net1.exe, producing two events per invocation.
  # Drop the child only when its parent is net.exe, so that an attacker calling
  # net1.exe directly is still detected.
  filter_net1_wrapper:
    Image|endswith: '\net1.exe'
    ParentImage|endswith: '\net.exe'
  condition: (selection_net or selection_nltest) and not filter_net1_wrapper
fields:
  - ParentImage
  - Image
  - CommandLine
  - User
  - ComputerName
falsepositives:
  - Administrative scripts and logon scripts that query group membership
  - Systems management and inventory agents
  - Help desk tooling invoked by support staff
  - IT staff performing legitimate account lookups
level: low
